<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110b">
<title>Gold Mine – produits gagnants</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 class="brand"><span aria-hidden="true">⛏️</span> Gold Mine</h1>
    <label class="country">
      <span class="sr">Pays</span>
      <select id="country" aria-label="Pays"></select>
    </label>
  </div>
  <p id="updated" class="updated">Chargement…</p>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="winners" class="on">Produits gagnants</button>
    <button data-tab="trends">Tendances</button>
    <button data-tab="sellers">Nouveaux vendeurs</button>
    <button data-tab="elsewhere">Gagnants ailleurs</button>
    <button data-tab="settings">Réglages</button>
  </nav>
</header>

<main>
  <form id="filters" class="filters" autocomplete="off">
    <label>Catégorie
      <select id="f-cat"><option value="">Toutes</option></select>
    </label>
    <label>Tendance
      <select id="f-trend">
        <option value="">Toutes</option>
        <option value="rising">En hausse</option>
        <option value="stable">Stable</option>
        <option value="dying">En baisse</option>
      </select>
    </label>
    <label>Score min.
      <input id="f-score" type="number" min="0" max="100" step="5" inputmode="numeric" placeholder="0">
    </label>
    <label>Marge min. <span class="cur"></span>
      <input id="f-margin" type="number" step="5" inputmode="numeric" placeholder="aucune">
    </label>
  </form>
  <div id="view" aria-live="polite"></div>
</main>

<footer class="foot">
  Données publiques de la Bibliothèque publicitaire Meta. Les marges et coûts pub sont des
  estimations, pas des chiffres réels.
</footer>

<script src="score.js"></script>
<script src="app.js"></script>
</body>
</html>
